<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090d25"><title>Super Thombo – Neon PC World</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080c20;color:white;font:700 16px system-ui;overflow:hidden;touch-action:none}#app{width:100%;max-width:1100px;margin:auto;position:relative}canvas{display:block;width:100%;height:auto;max-height:75dvh;object-fit:contain;background:#090e2a}#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse,#232468ed,#080b25f5);gap:12px;text-align:center}h1{font-size:clamp(40px,10vw,90px);font-style:italic;line-height:.92;margin:0;color:#ffdb27;text-shadow:4px 5px #f43d78,8px 10px #40145b,0 0 25px #16cfff}#menu{overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#1259b8bb,#150a38ed 68%,#070b20f8),repeating-linear-gradient(115deg,#08c9ed22 0 5px,transparent 5px 80px)!important}#menu:before{content:'💻 ⚡ 👾 🪙 🍄 ₿ 🌟';position:absolute;top:5%;font-size:clamp(20px,4vw,42px);letter-spacing:8px;filter:drop-shadow(0 0 14px cyan);pointer-events:none}#menu h1{z-index:1;font-size:clamp(43px,9vw,100px);text-shadow:3px 4px #ef285b,7px 9px #471052,0 0 28px #10eaff}#menu button{z-index:1;width:min(70%,350px);padding:8px 12px;font-size:clamp(13px,2.5vw,22px)}#menu #play{background:linear-gradient(#48ff63,#008b26);box-shadow:0 5px #02541d}#menu p{z-index:1}#menu p{margin:5px;font-size:clamp(13px,3vw,20px)}button{color:white;border:2px solid #ffffff90;border-radius:20px;font:900 20px system-ui;padding:12px 18px;background:linear-gradient(160deg,#27dafa,#1553bb);box-shadow:0 5px 0 #10285b;touch-action:none;-webkit-user-select:none;user-select:none}button:active{filter:brightness(1.35);transform:translateY(2px)}#play{background:linear-gradient(#ffcd38,#f06a1b);box-shadow:0 6px #9c2e29;font-size:26px}#bar{display:flex;align-items:center;justify-content:space-between;padding:5px 12px;font-size:14px;background:#111631}#controls{display:flex;justify-content:space-between;gap:8px;padding:10px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));align-items:center}#controls button{min-width:64px;min-height:62px}#controls .jump{background:linear-gradient(#ffbf42,#f26a20)}#controls .cable{background:linear-gradient(#b655f7,#6524b6);font-size:14px}#tip{text-align:center;font-size:11px;color:#a6b8d8}</style><div id="app"><canvas id="screen" width="960" height="520"></canvas><div id="menu"><h1>SUPER<br>THOMBO</h1><p>💻 Neon-Mainboards · 👾 Viren · 🪙 Coins · ⚡ RAM</p><button id="play">▶ SPIEL STARTEN</button><button id="levels">🌍 LEVEL AUSWÄHLEN</button><button id="highscores">🏆 HIGHSCORES</button><button id="help">📖 ANLEITUNG</button><button id="settings">⚙ EINSTELLUNGEN</button><p id="subtitle">Finde grüne Röhren, sammle ₿ und erreiche das goldene Ziel!</p></div></div><div id="bar"><span id="world">WELT 1 · MAINBOARD CITY</span><span>🪙 <span id="coins">0</span>　❤️ <span id="lives">3</span>　⚡ <span id="ram">0</span></span></div><div id="controls"><div><button id="left">◀</button> <button id="right">▶</button></div><div><button id="cable" class="cable">⬇<br>KABEL</button> <button id="jump" class="jump">⬆ SPRUNG</button></div></div><div id="tip">Doppelsprung: 2× ⬆ · Grüne Röhre: ⬇ · Goldenes Level-Ziel: ⬇ · KEIN automatischer Levelwechsel</div><script>(()=>{'use strict';const c=document.getElementById('screen'),g=c.getContext('2d'),menu=document.getElementById('menu');const W=960,H=520;const worlds=[['MAINBOARD CITY','#101332','#11e7f4','#e83efc'],['GPU SKYLINE','#1a1038','#ff50df','#3aeaff'],['RAM FOREST','#0c2b2d','#8bff40','#19e8ae'],['CPU CORE','#32151f','#ffac31','#ff3b6a']];let active=false,bonus=false,world=0,score=0,lives=3,ram=0,frame=0,cam=0,p,coins=[],viruses=[],blocks=[],portals=[],particles=[];const key={left:false,right:false};let backX=0;let checkpoint=90;let message='';let messageUntil=0;function build(){p={x:90,y:405,vy:0,jumps:0,inv:0};cam=0;coins=[];viruses=[];blocks=[];portals=[];particles=[];checkpoint=90;let count=bonus?19:38;for(let i=0;i<count;i++)coins.push({x:bonus?170+i*76:225+i*105,y:bonus?250-(i%5)*35:280-(i%4)*33,taken:false});if(!bonus){for(let i=0;i<12;i++)viruses.push({x:550+i*315,y:411,alive:true,dir:i%2?1:-1});for(let i=0;i<13;i++)blocks.push({x:390+i*275,y:220+(i%3)*36,used:false});for(let i=0;i<4;i++)portals.push({x:560+i*940})}else portals.push({x:1580});updateHud()}function updateHud(){document.getElementById('world').textContent='WELT '+(world+1)+' · '+(bonus?'KABEL-BONUS':worlds[world][0]);document.getElementById('coins').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('ram').textContent=ram}function start(){active=true;bonus=false;world=0;score=0;lives=3;ram=0;build();menu.style.display='none'}document.getElementById('play').onclick=start;document.getElementById('levels').onclick=()=>{let v=prompt('Welche Welt? 1 Mainboard, 2 GPU, 3 RAM, 4 CPU','1');let n=Number(v);if(n>=1&&n<=4){start();world=n-1;build()}};document.getElementById('highscores').onclick=()=>alert('Dein aktueller Rekord: '+(localStorage.getItem('thomboHigh')||'0')+' Coins!');document.getElementById('help').onclick=()=>alert('◀ ▶ Laufen, ⬆ Springen (2× = Doppelsprung), ⬇ an grünen Röhren für Bitcoin-Bonuslevel und am goldenen Ziel zum Levelwechsel. Viren von oben besiegen!');document.getElementById('settings').onclick=()=>alert('Tipp: Spiele im Querformat für die größte Ansicht!');function jump(){if(!active)return;if(p.jumps<2){p.vy=p.jumps===0?-14.2:-12.5;p.jumps++}}function cable(){if(!active)return;const portal=portals.find(v=>Math.abs(v.x-p.x)<110);if(!portal){if(!bonus&&p.x>3710){world=(world+1)%4;build();message='NEUE WELT FREIGESCHALTET!';messageUntil=frame+180}else{message='Suche eine Röhre und stelle dich direkt davor!';messageUntil=frame+100}return;}if(bonus){bonus=false;build();p.x=backX+120}else{backX=p.x;bonus=true;build();p.x=90}}function hold(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);key[k]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>key[k]=false)}hold('left','left');hold('right','right');document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.getElementById('cable').addEventListener('pointerdown',e=>{e.preventDefault();cable()});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.left=true;if(e.key==='ArrowRight')key.right=true;if((e.key==='ArrowUp'||e.key===' ')&&!e.repeat)jump();if(e.key==='ArrowDown')cable();if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.left=false;if(e.key==='ArrowRight')key.right=false});function box(x,y,w,h,fill,stroke){g.fillStyle=fill;g.fillRect(x,y,w,h);if(stroke){g.strokeStyle=stroke;g.lineWidth=3;g.strokeRect(x,y,w,h)}}function txt(s,x,y,n,color){g.font='900 '+n+'px system-ui';g.fillStyle=color;g.fillText(s,x,y)}function glow(x,y,r,color){let gr=g.createRadialGradient(x,y,2,x,y,r);gr.addColorStop(0,color);gr.addColorStop(1,'transparent');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}function tick(){frame++;if(active){p.x=Math.max(35,p.x+((key.right?5.8:0)-(key.left?5.8:0))*(ram?1.24:1));p.vy+=.7;p.y+=p.vy;if(p.y>=407){p.y=407;p.vy=0;p.jumps=0}if(p.inv)p.inv--;for(const a of coins)if(!a.taken&&Math.abs(a.x-p.x)<31&&Math.abs(a.y-p.y+27)<55){a.taken=true;score++;if(score>Number(localStorage.getItem('thomboHigh')||0))localStorage.setItem('thomboHigh',String(score));particles.push({x:a.x,y:a.y,life:30})}for(const b of blocks)if(!b.used&&Math.abs(b.x-p.x)<41&&p.vy<0&&p.y>b.y&&p.y<b.y+67){b.used=true;p.vy=3;if(Math.floor(b.x/275)%3===0)ram++;else score+=5}for(const e of viruses){if(!e.alive)continue;e.x+=e.dir*.65;if(Math.abs(e.x-p.x)<35&&Math.abs(e.y-p.y+10)<42){if(p.vy>1&&p.y<e.y-10){e.alive=false;p.vy=-10;score+=2}else if(!p.inv){lives--;p.inv=100;p.vy=-7;p.x=Math.max(90,checkpoint);if(lives===0){active=false;menu.style.display='flex';menu.querySelector('h1').innerHTML='GAME<br>OVER';document.getElementById('play').textContent='↻ NOCHMAL'}}}}if(bonus&&p.x>1750){p.x=1550;p.vy=0;message='Benutze die lila Ausgangsröhre mit ⬇';messageUntil=frame+150}if(!bonus&&p.x>3850){p.x=3850;p.vy=0;message='LEVEL-ZIEL! Tippe ⬇ KABEL am goldenen Ausgang!';messageUntil=frame+150}if(!bonus&&p.x>checkpoint+950){checkpoint=Math.floor(p.x/950)*950;message='CHECKPOINT GESPEICHERT!';messageUntil=frame+110}cam=Math.max(0,p.x-225);updateHud()}for(const z of particles){z.y-=1.5;z.life--}particles=particles.filter(z=>z.life>0)}function draw(){const t=worlds[world],bg=bonus?'#190e3b':t[1],cyan=bonus?'#ffdb40':t[2],pink=t[3];let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,bg);grad.addColorStop(1,'#070c1c');g.fillStyle=grad;g.fillRect(0,0,W,H);for(let i=0;i<30;i++){let x=((i*179-cam*.18)%1160+1160)%1160-70;let y=45+(i*89)%285;glow(x,y,40,i%2?cyan+'33':pink+'33');box(x,y,42+(i%4)*20,50+(i%3)*30,'#25315499',cyan+'66');for(let j=0;j<3;j++)box(x+8+j*12,y+8,5,22,j%2?pink:cyan)}for(let i=0;i<18;i++){let x=((i*250-cam*.38)%1100+1100)%1100;g.strokeStyle=i%2?pink+'88':cyan+'88';g.lineWidth=6;g.beginPath();g.moveTo(x,390);g.bezierCurveTo(x+75,170,x-40,180,x+90,100);g.stroke()}g.save();g.translate(-cam,0);box(0,438,5200,82,'#151b37',cyan);for(let i=0;i<48;i++){let x=i*115;box(x+9,449,88,44,'#293c59',pink+'55');box(x+24,461,54,5,cyan+'88')}for(let i=0;i<19;i++){let x=140+i*215;box(x,370,155,23,'#2b3554',cyan);box(x+9,392,137,8,pink);box(x+20,399,10,28,cyan+'88')}for(const a of coins)if(!a.taken){glow(a.x,a.y,32,'#ffd13088');g.beginPath();g.fillStyle='#ffce26';g.ellipse(a.x,a.y,13,20,0,0,7);g.fill();g.strokeStyle='#fff0a1';g.lineWidth=4;g.stroke();txt(bonus?'₿':'1',a.x-(bonus?9:6),a.y+7,18,'#b7660a')}for(const b of blocks){glow(b.x,b.y,40,b.used?'#7587ac33':'#ffd03855');box(b.x-24,b.y-24,48,48,b.used?'#69718e':'#ffad22','#ffe4a0');if(!b.used)txt('?',b.x-13,b.y+14,37,'#783c76')}if(!bonus){glow(3850,382,130,'#ffd53488');box(3800,325,100,113,'#a5660a','#ffe77c');box(3810,338,80,90,'#3c2135','#fff09a');txt('ZIEL ➜',3785,308,25,'#ffe267')}for(const v of portals){glow(v.x,385,115,bonus?'#ffdc3788':'#22ff6688');box(v.x-48,347,96,92,bonus?'#9a58f4':'#19a65d',bonus?'#ffd85a':'#8affad');box(v.x-57,333,114,25,bonus?'#a65aff':'#24d96d','#d6ffdb');box(v.x-30,370,60,67,'#081a24','#6dffb2');txt(bonus?'AUSGANG':'COIN-WELT',v.x-66,315,18,'#ffef67');txt('⬇',v.x-14,413,29,'#ffdf56')}for(const e of viruses)if(e.alive){glow(e.x,e.y,48,'#ff255f77');g.fillStyle='#e43a65';g.beginPath();g.arc(e.x,e.y,27,0,7);g.fill();for(let i=0;i<8;i++){let a=i*Math.PI/4;box(e.x+Math.cos(a)*28-4,e.y+Math.sin(a)*28-4,8,8,'#ff7b9c')}box(e.x-15,e.y-8,11,9,'#fff');box(e.x+4,e.y-8,11,9,'#fff');box(e.x-11,e.y-5,6,5,'#222');box(e.x+8,e.y-5,6,5,'#222');txt('⌣',e.x-9,e.y+20,24,'#260d2b')}if(!p.inv||frame%8<4){g.save();g.translate(p.x,p.y);if(ram)g.scale(1.2,1.2);glow(0,-30,65,'#19dcff44');box(-13,-53,29,41,'#da3e52','#ffabb2');box(-12,-13,11,15,'#263b6d');box(6,-13,11,15,'#263b6d');box(-15,-76,33,27,'#f2bc91');box(-18,-83,39,11,'#b32b40');box(-9,-68,11,8,'#f6faff','#222');box(5,-68,11,8,'#f6faff','#222');box(13,-48,33,34,'#384365','#90a4c9');box(17,-43,25,22,'#19213d','#14eaff');box(21,-39,8,8,'#c92ff7');box(31,-39,8,8,'#26e6ef');g.restore()}for(const z of particles)txt('+1',z.x,z.y,22,'#ffec67');g.restore();txt('SUPER THOMBO',22,39,29,'#ffce2b');txt('WELT '+(world+1),W-150,37,23,cyan);if(frame<messageUntil)txt(message,Math.max(20,W/2-message.length*6),115,19,'#fff68a');if(bonus){txt('₿ BITCOIN-BONUSWELT ₿',W/2-155,42,23,'#ffce2b');txt('Sammle ₿ und finde die Ausgangsröhre!',250,80,20,'#fff')}}function loop(){tick();draw();requestAnimationFrame(loop)}build();loop()})();</script></html>
