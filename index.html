<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d25">
<title>Super Thombo – Acht Welten, ein Abenteuer</title>
<link rel="stylesheet" href="styles.css">
<script defer src="game.js"></script>
</head>
<body>
<div id="app">
<canvas id="screen" width="960" height="520" tabindex="0" aria-label="Super Thombo Spielfeld"></canvas>
<div id="menu">
<div class="poster" role="group" aria-label="Super Thombo Hauptmenü">
<button class="hotspot" id="play" aria-label="Spiel starten">SPIEL STARTEN</button>
<button class="hotspot" id="levels" aria-label="Level auswählen">LEVEL AUSWÄHLEN</button>
<button class="hotspot" id="highscores" aria-label="Highscores">HIGHSCORES</button>
<button class="hotspot" id="help" aria-label="Anleitung">ANLEITUNG</button>
<button class="hotspot" id="settings" aria-label="Einstellungen">EINSTELLUNGEN</button>
<section id="world-strip" aria-label="Alle acht Welten">
<div class="strip-heading">DEIN NÄCHSTES ABENTEUER <span>8 WELTEN · WISCHEN ↔</span></div>
<div id="world-track"></div>
</section>
</div>
<div id="world-wheel" aria-label="Weltauswahl">
<button id="wheel-close" aria-label="Zurück zum Hauptmenü">✕</button>
<div class="wheel-title">WÄHLE DEINE WELT</div>
<div id="wheel-stage"></div>
<div id="wheel-caption" aria-live="polite"></div>
<button id="wheel-go">▶ WELT SPIELEN</button>
</div>
</div>
<div id="bar"><button id="home">⌂ MENÜ</button><span id="world"></span><span>🪙 <b id="coins">0</b></span><span>♥ <b id="lives">3</b></span><span>RAM <b id="ram">0</b></span><button id="soundtest">🔊 TON AN</button></div>
<div id="speech" aria-live="polite">💬 Thombo: Bereit für acht verrückte Computerwelten?</div>
<div id="controls"><div><button id="left" aria-label="Nach links">◀</button><button id="right" aria-label="Nach rechts">▶</button></div><div><button id="cable" class="cable">⬇ KABEL</button><button id="jump" class="jump">⬆ SPRUNG</button></div></div>
<div id="tip">Pfeile / WASD · Leertaste: Doppelsprung · Escape: Menü · Auf Röhren: ↓</div>
</div>
</body>
</html>
