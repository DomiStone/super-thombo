<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10112f"><title>Super Thombo</title><style>*{box-sizing:border-box}body{margin:0;background:#090b22;color:white;font-family:system-ui;text-align:center;overflow:hidden;touch-action:none}#wrap{max-width:900px;margin:auto;position:relative}canvas{width:100%;height:auto;max-height:76dvh;display:block;background:#14133b}#menu{position:absolute;inset:0;background:linear-gradient(135deg,#131341ee,#251263ef);display:grid;place-content:center;gap:15px}h1{font-size:clamp(35px,8vw,70px);margin:0;color:#ffce42;text-shadow:4px 5px #d3428e,0 0 22px #00dfff}button{border:2px solid #ffffff88;border-radius:17px;background:linear-gradient(#13cde6,#1263c3);color:white;font-weight:900;font-size:22px;padding:13px 20px;touch-action:none}#controls{display:flex;justify-content:space-between;padding:12px;gap:10px}#controls button{min-width:75px;min-height:68px;box-shadow:0 5px #07385e}#status{font-size:14px;padding:6px}small{color:#d4cfff}</style><div id="wrap"><canvas id="game" width="800" height="460"></canvas><div id="menu"><h1>SUPER THOMBO</h1><div>💻 Reise durch den Computer! 👾</div><button id="start">▶ SPIEL STARTEN</button><small>◀ ▶ bewegen · ⬆ springen (zweimal = Doppelsprung)</small></div></div><div id="status">🪙 <span id="coins">0</span> · ❤️ <span id="lives">3</span> · <span id="world">MAINBOARD</span></div><div id="controls"><div><button id="left">◀</button> <button id="right">▶</button></div><div><button id="jump">⬆ SPRUNG</button> <button id="restart">↻</button></div></div><script>(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),menu=document.getElementById('menu');const W=800,H=460;let run=false,frame=0,cam=0,coins=0,lives=3,level=0;const keys={left:false,right:false};let p,items,enemies,blocks;const themes=[['MAINBOARD','#121537','#23f1ed'],['GRAFIKKARTE','#2b103e','#ff48c4'],['RAM-WELT','#123b35','#a6ff44'],['CPU-KERN','#3c1d20','#ff9b35']];function reset(){p={x:65,y:270,vx:0,vy:0,jumps:0,big:0,inv:0};cam=0;items=Array.from({length:28},(_,i)=>({x:240+i*115,y:230+(i%3)*-38,taken:false}));enemies=Array.from({length:10},(_,i)=>({x:450+i*310,y:355,dir:i%2?1:-1,alive:true}));blocks=Array.from({length:14},(_,i)=>({x:340+i*245,y:185+(i%2)*45,used:false}));document.getElementById('world').textContent=themes[level][0]}function begin(){level=0;coins=0;lives=3;reset();run=true;menu.style.display='none'}document.getElementById('start').onclick=begin;document.getElementById('restart').onclick=begin;function jump(){if(!run)return;if(p.jumps<2){p.vy=p.jumps===0?-13.4:-12;p.jumps++}}function bind(id,key){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[key]=true});for(let evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>keys[key]=false)}bind('left','left');bind('right','right');document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key===' '||e.key==='ArrowUp'){if(!e.repeat)jump();e.preventDefault()}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function text(t,x,y,size,color){g.fillStyle=color;g.font='bold '+size+'px system-ui';g.fillText(t,x,y)}function step(){frame++;if(!run)return;p.vx=(keys.right?5:0)-(keys.left?5:0);p.x=Math.max(20,p.x+p.vx);p.vy+=.68;p.y+=p.vy;let ground=360;if(p.y>=ground){p.y=ground;p.vy=0;p.jumps=0}if(p.inv)p.inv--;if(p.big)p.big--;for(const a of items)if(!a.taken&&Math.abs(p.x-a.x)<27&&Math.abs(p.y-a.y)<43){a.taken=true;coins++}for(const b of blocks)if(!b.used&&Math.abs(p.x-b.x)<40&&p.vy<0&&p.y>b.y&&p.y<b.y+54){b.used=true;p.vy=3;if(Math.floor(b.x)%3===0)p.big=500;else coins+=5}for(const e of enemies){if(!e.alive)continue;e.x+=e.dir*.65;if(Math.abs(p.x-e.x)<33&&Math.abs(p.y-e.y)<40){if(p.vy>1&&p.y<e.y-12){e.alive=false;p.vy=-10;coins+=2}else if(!p.inv){lives--;p.inv=90;p.vy=-7;if(lives<=0){run=false;menu.style.display='grid';menu.querySelector('h1').textContent='GAME OVER';document.getElementById('start').textContent='↻ NOCHMAL SPIELEN'}}}}if(p.x>3450){level=(level+1)%4;reset()}cam=Math.max(0,p.x-185);document.getElementById('coins').textContent=coins;document.getElementById('lives').textContent=lives}function draw(){let [name,bg,neon]=themes[level];rect(0,0,W,H,bg);for(let i=0;i<24;i++){let x=(i*143-cam*.35)%1000;if(x<0)x+=1000;g.strokeStyle=neon+'55';g.lineWidth=3;g.strokeRect(x-40,35+(i%5)*58,100,42);rect(x+7,48+(i%5)*58,18,18,neon+'66')}g.save();g.translate(-cam,0);for(let i=0;i<32;i++){let x=i*140;rect(x,395,110,8,neon);rect(x+15,410,80,4,'#6a7da9')}rect(0,385,4000,75,'#161b38');rect(0,381,4000,6,neon);for(let i=0;i<25;i++){rect(i*160+35,404,85,40,'#27345a');rect(i*160+42,410,70,3,neon+'99')}for(const a of items)if(!a.taken){text('🪙',a.x-14,a.y+10,29,'#ffd441')}for(const b of blocks){rect(b.x-20,b.y-20,42,42,b.used?'#67718b':'#ffbb25');g.strokeStyle='#fff3a5';g.lineWidth=3;g.strokeRect(b.x-20,b.y-20,42,42);if(!b.used)text('?',b.x-12,b.y+12,33,'#502b71')}for(const e of enemies)if(e.alive){text('👾',e.x-23,e.y+16,43,'white')}if(!p.inv||frame%8<4){g.save();g.translate(p.x,p.y);if(p.big)g.scale(1.25,1.25);rect(-12,-43,24,34,'#1988df');rect(-12,-11,10,12,'#343357');rect(3,-11,10,12,'#343357');rect(-14,-65,29,25,'#f3bc8f');rect(-17,-73,35,12,'#ee354a');rect(-9,-55,9,5,'#fff');rect(4,-55,9,5,'#fff');rect(-9,-54,9,2,'#202434');rect(4,-54,9,2,'#202434');rect(13,-35,27,19,'#9ca9c4');rect(17,-32,18,12,'#24e4f4');rect(21,-17,13,3,'#303852');g.restore()}g.restore();text('🌐 '+name,18,32,22,'#fff');text('🪙 '+coins,660,32,23,'#ffdc52');if(!run&&menu.style.display==='none')text('TIPPE START',300,200,35,'white')}function loop(){step();draw();requestAnimationFrame(loop)}reset();loop()})();</script></html>
